[project]
name = "oss-mentor"
version = "0.1.0"
description = "AI mentor that takes students from zero to their first open-source pull request"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=1.11",
  "fastapi>=0.110",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "psycopg[binary]>=3.2",
  "cryptography>=43",
]

[tool.vercel]
entrypoint = "backend.app:app"
